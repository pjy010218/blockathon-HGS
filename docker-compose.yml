services:
  db:
    image: postgres:16
    container_name: water-audit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-water}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-water}
      POSTGRES_DB: ${POSTGRES_DB:-water_audit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-water} -d ${POSTGRES_DB:-water_audit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: water-audit-pgdata
